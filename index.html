<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allianz Market</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="authPage" class="auth-page">
    <div class="glass auth-card">
      <h1 id="authTitle">Регистрация</h1>

      <input id="authEmail" type="email" placeholder="Email">
      <input id="authNick" type="text" placeholder="Ник">
      <input id="authUsername" type="text" placeholder="Юзер">
      <input id="authTelegram" type="text" placeholder="Telegram @username">
      <input id="authPassword" type="password" placeholder="Пароль">

      <button id="authButton">ЗАРЕГИСТРИРОВАТЬСЯ</button>
      <button id="authSwitch" class="secondary">У МЕНЯ ЕСТЬ АККАУНТ</button>
      <p id="authMessage"></p>
    </div>
  </main>

  <main id="mainPage" class="hidden">
    <header class="topbar">
      <h2>ALLIANZ MARKET</h2>
      <button id="menuButton">☰</button>
    </header>

    <nav id="menu" class="menu">
      <button data-section="home">Главная</button>
      <button data-section="market">Рынок</button>
      <button data-section="profile">Профиль</button>
      <button data-section="users">Пользователи</button>
      <button data-section="gg">GG</button>
      <button id="adminMenuButton" data-section="admin">Админ</button>
      <button id="logoutButton">Выйти</button>
    </nav>

    <section id="home" class="content active">
      <div class="glass card">
        <h1>Добро пожаловать 👋</h1>
        <p>Allianz Market</p>
      </div>
    </section>

    <section id="market" class="content">
      <div class="glass card">
        <h2>🚗 Добавить машину</h2>
        <input id="carName" placeholder="Название">
        <input id="carPhoto" placeholder="URL фото">
        <textarea id="carDescription" placeholder="Описание"></textarea>
        <input id="carStats" placeholder="Характеристики">
        <input id="carPrice" placeholder="Цена">
        <button id="addCarButton">Опубликовать</button>
      </div>
      <div id="carList"></div>
    </section>

    <section id="profile" class="content">
      <div id="myProfile"></div>
      <div class="glass card">
        <button id="deleteAccountButton" class="danger">Удалить аккаунт</button>
      </div>
    </section>

    <section id="users" class="content">
      <div id="userList"></div>
    </section>

    <section id="gg" class="content">
      <div class="glass card">
        <h2>🛠️ GG заказ</h2>
        <input id="ggTitle" placeholder="Услуга">
        <textarea id="ggDescription" placeholder="Описание"></textarea>
        <button id="createGGButton">Создать заказ</button>
      </div>
      <div id="ggOrders"></div>
    </section>

    <section id="admin" class="content">
      <div id="adminList"></div>
    </section>

    <section id="publicProfile" class="content">
      <div id="publicProfileBox"></div>
    </section>
  </main>

  <div id="deleteModal" class="modal">
    <div class="glass card">
      <h2>Удалить аккаунт?</h2>
      <button id="confirmDeleteButton" class="danger">Удалить</button>
      <button id="closeDeleteButton" class="secondary">Отмена</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
