<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allianz Market</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js" defer></script>
</head>
<body>
<div id="authPage" class="page"><div class="glass auth-box">
<h1 id="authTitle">Регистрация</h1><p class="subtitle">Allianz Market</p>
<input id="authEmail" type="email" placeholder="Email">
<input id="authNick" placeholder="Ник">
<input id="authUsername" placeholder="Юзер">
<input id="authTelegram" placeholder="Telegram: @username">
<input id="authPassword" type="password" placeholder="Пароль">
<button id="authButton" class="red-button">ЗАРЕГИСТРИРОВАТЬСЯ</button>
<button id="authSwitch" class="link-button">У МЕНЯ ЕСТЬ АККАУНТ</button>
<div id="authMessage" class="message"></div>
</div></div>
<div id="mainPage" class="page hidden">
<header class="topbar glass"><div class="logo">ALLIANZ MARKET</div><button id="menuButton" class="red-button small">☰</button></header>
<nav id="menu" class="menu glass">
<button data-section="home">🏠 Главная</button><button data-section="market">🚗 Рынок</button><button data-section="users">👥 Пользователи</button><button data-section="gg">🛠️ GG</button><button data-section="profile">👤 Профиль</button><button id="adminMenuButton" data-section="admin">🛡️ Админ</button><button id="logoutButton">🚪 Выйти</button>
</nav>
<main>
<section id="home" class="content active"><div class="glass card"><h1>Добро пожаловать 👋</h1><p>Добро пожаловать в Allianz Market.</p></div></section>
<section id="market" class="content"><div class="glass card"><h2>🚗 Добавить машину</h2><input id="carName" placeholder="Название машины"><input id="carPhoto" placeholder="URL фотографии"><textarea id="carDescription" placeholder="Описание"></textarea><input id="carStats" placeholder="Характеристики"><input id="carPrice" placeholder="Цена"><button id="addCarButton" class="red-button">ОПУБЛИКОВАТЬ</button></div><div id="carList"></div></section>
<section id="users" class="content"><div class="glass card"><h2>👥 Пользователи</h2><div id="userList"></div></div></section>
<section id="profile" class="content"><div class="glass card"><h2>👤 Мой профиль</h2><div id="myProfile"></div></div><div class="glass card"><button id="deleteAccountButton" class="red-button">УДАЛИТЬ ПРОФИЛЬ</button></div></section>
<section id="publicProfile" class="content"><div class="glass card" id="publicProfileBox"></div></section>
<section id="gg" class="content"><div class="glass card"><h2>🛠️ GG</h2><input id="ggTitle" placeholder="Какая услуга нужна?"><textarea id="ggDescription" placeholder="Описание заказа"></textarea><button id="createGGButton" class="red-button">СОЗДАТЬ ЗАКАЗ</button></div><div id="ggOrders"></div></section>
<section id="admin" class="content"><div class="glass card"><h2>🛡️ Админ-панель</h2><div id="adminList"></div></div></section>
</main></div>
<div id="deleteModal" class="modal"><div class="glass modal-box"><h2>Удалить аккаунт?</h2><button id="confirmDeleteButton" class="red-button">УДАЛИТЬ</button><button id="closeDeleteButton" class="link-button">ОТМЕНА</button></div></div>
</body></html>
